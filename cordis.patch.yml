# ============================================================================
# dsh-redteam-pet 的 bundle patch —— 声明本插件在配置树里的插件行
# ============================================================================
#
# 【为什么是 bundle 自持，而不是写在 profile 用户层】
#   2026-10-05 踩了一个大坑：原先这里故意留空数组 []，插件行改由 profile 用户层
#   （$DSH_HOME/profiles/web/cordis.patch.yml）手写 insert。当时的理由是"bundle 层是
#   启动快照、用户层才能存盘即生效"。
#
#   但那个方案有个致命问题：**dshmarket 会重写 profile 用户层**，把不是它自己写的
#   条目（手写 insert、手写 disabled 行）整段抹掉。结果是：
#     · 插件突然不挂载（insert 被抹）
#     · 我补的 `- id: dsh-pet / disabled: true` 被抹，dsh-pet 又活了、来抢命令名
#   一晚上反复打地鼠。**手写用户层 = 跟 dshmarket 抢同一个文件 = 输。**
#
#   所以改成和 dsh-pet 一模一样的正规做法：
#     · 包自己的 patch（本文件）insert 自己的插件行
#     · 包名进 dsh.profile.bundles
#   这样它就在商场的管理体系内，开关、安装、卸载都由商场正常处理，不会再被抹。
#
# 【重要：不要再往 profile 用户层手写插件行】
#   两边都 insert 会追加出**两只宠物**（insert 不按 id 去重）。
#   本文件是唯一的插件行来源。
#
# 【改完要重启 DSH】
#   bundle 层是启动那一刻的快照，改了必须重启才生效（用户层才是热重载的）。
# ============================================================================

- insert:
    - id: dsh-redteam-pet
      name: 'dsh-redteam-pet'
